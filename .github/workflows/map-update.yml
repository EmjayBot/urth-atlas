name: Auto-apply map updates

on:
  # Applying is gated on approval: nothing happens when the issue is opened.
  # A maintainer reviews it and adds the "approved" label to trigger the run.
  # Only users with triage/write access can label issues, so this is a real
  # gate. Remove + re-add the label to retry after a failure.
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    # Only process maintainer-approved community map updates.
    if: startsWith(github.event.issue.title, 'Map update:') && github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and merge JSON from issue body
        id: merge
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = context.payload.issue.body || "";

            // Parse the ```json ... ``` block from the issue body.
            const m = body.match(/```json\s*([\s\S]*?)```/);
            if (!m) {
              core.setFailed("No JSON block found in issue body");
              return;
            }
            const patch = JSON.parse(m[1]);

            // Validate shape: { "Name": { kind, href, x, y, territory? } }.
            // A null value is a removal tombstone: delete that name.
            // territory is an optional flag string marking territories
            // (subnational pin style); it is preserved verbatim so
            // community updates never wipe it.
            const KINDS = new Set(["nation", "capital", "city", "town"]);
            const clean = {};
            const removed = [];
            for (const [rawName, v] of Object.entries(patch)) {
              const name = rawName.trim();
              if (!name || name.startsWith("_")) continue;
              if (v === null) {
                removed.push(name);
                continue;
              }
              if (
                v && typeof v === "object" &&
                KINDS.has(v.kind) &&
                typeof v.href === "string" &&
                Number.isFinite(v.x) && Number.isFinite(v.y)
              ) {
                // Canonical key order (kind, href, territory, x, y) so the
                // change comparison below isn't fooled by key ordering.
                clean[name] = { kind: v.kind, href: v.href };
                if (typeof v.territory === "string" && v.territory.trim()) {
                  clean[name].territory = v.territory.trim().slice(0, 80);
                }
                clean[name].x = Math.round(v.x);
                clean[name].y = Math.round(v.y);
              }
            }
            if (!Object.keys(clean).length && !removed.length) {
              core.setFailed("No valid place entries in issue body");
              return;
            }

            // Merge into public/positions.json (keeping metadata keys).
            // Only write + commit when something actually changed, so
            // no-op removals (unknown name) report instead of failing.
            const file = "public/positions.json";
            const cur = JSON.parse(fs.readFileSync(file, "utf8"));
            const next = { ...cur };
            const appliedAdds = [];
            for (const [name, v] of Object.entries(clean)) {
              // Carry over the territory flag when the patch omits it,
              // so community updates to a territory never wipe the styling.
              // Rebuilt in canonical key order for a stable comparison.
              let entry = v;
              if (!("territory" in v) && typeof next[name]?.territory === "string") {
                entry = { kind: v.kind, href: v.href, territory: next[name].territory, x: v.x, y: v.y };
              }
              if (JSON.stringify(next[name]) !== JSON.stringify(entry)) {
                next[name] = entry;
                appliedAdds.push(name);
              }
            }
            const appliedDels = [];
            const notFound = [];
            for (const name of removed) {
              if (name in next) {
                delete next[name];
                appliedDels.push(name);
              } else {
                notFound.push(name);
              }
            }
            const changed = appliedAdds.length + appliedDels.length > 0;
            if (changed) {
              fs.writeFileSync(file, JSON.stringify(next, null, 2) + "\n");
            }
            const appliedList = [...appliedAdds, ...appliedDels.map((n) => `-${n}`)].join(", ");
            core.setOutput("applied", appliedList);
            core.setOutput("file_changed", changed ? "true" : "false");
            let summary;
            if (changed) {
              summary = `Merged into positions.json: ${appliedList}. Thanks for contributing! 🗺️`;
            } else {
              summary = "No changes applied — everything was already up to date.";
            }
            if (notFound.length) {
              summary += ` Not found in positions.json: ${notFound.join(", ")}.`;
            }
            core.setOutput("summary", summary);

      - name: Commit and push
        if: steps.merge.outputs.file_changed == 'true'
        env:
          # Passed via env (not inline ${{ }}) so issue-controlled names are
          # never re-parsed as shell syntax by the runner.
          APPLIED: ${{ steps.merge.outputs.applied }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/positions.json
          git commit -m "Apply map update: $APPLIED"
          git push

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: ${{ toJSON(steps.merge.outputs.summary) }},
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: "closed",
            });