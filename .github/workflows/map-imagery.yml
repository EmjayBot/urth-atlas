# Pull map imagery masters from the urth-imagery pipeline repo.
#
# Downloads atlas/*.png from urth-imagery@main into public/, rebuilds the
# derived webps (full-res political + mobile variants), and commits anything
# that changed. Triggered by urth-imagery after each sync, or manually via
# Actions > map-imagery > Run workflow. The Pages deploy picks it up.
#
# Imagery source of truth: https://github.com/urth-rp/urth-imagery
# (XCF -> PNG export from urth-rp/urthmaps via its xcf-sync workflow).

name: map-imagery
on:
  workflow_dispatch:              # manual "Run workflow" button
  repository_dispatch:            # fired by urth-imagery after each sync
    types: [imagery-update]

permissions:
  contents: write

concurrency:
  group: map-imagery
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SRC: https://raw.githubusercontent.com/urth-rp/urth-imagery/main/atlas
    steps:
      # PAT push (not GITHUB_TOKEN): pushes made by GITHUB_TOKEN never
      # trigger other workflows, which would silently skip the Pages
      # deploy. Needs ATLAS_PUSH_TOKEN (classic PAT, `public_repo`).
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ATLAS_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download imagery masters
        run: |
          for f in cities.png subnational.png blank-political.png national.png ocean.png; do
            curl -fSL "$SRC/$f" -o "public/$f" || { echo "FAILED: $f"; exit 1; }
          done
          ls -la public/*.png

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Rebuild derived webps
        run: |
          npm ci
          npm install --no-save sharp
          node -e "
            Promise.all([import('sharp'), import('node:fs')]).then(async ([{default: sharp}, fs]) => {
              // Ocean base under the political layer: the Political export
              // leaves oceans transparent, which showed the blurry preview
              // backdrop through. Composite over the Ocean master instead.
              await sharp('public/ocean.png')
                .composite([{ input: 'public/blank-political.png' }])
                .png()
                .toFile('public/blank-political.composited.png');
              fs.renameSync('public/blank-political.composited.png', 'public/blank-political.png');
              console.log('ocean base composited');
              // Tiny blurred-preview backdrop (matches checked-in 640px size).
              await sharp('public/blank-political.png')
                .resize({ width: 640 })
                .webp({ quality: 60, effort: 6 })
                .toFile('public/preview-political.webp');
              console.log('preview-political.webp rebuilt');
              // Full-res political webp (app primary; PNG is the fallback).
              await sharp('public/blank-political.png')
                .webp({ quality: 90, effort: 6 })
                .toFile('public/blank-political.webp');
              console.log('blank-political.webp rebuilt');
            });
          "
          npm run images:mobile

      - name: Commit imagery
        # Auto-bump ?v= cache-busters, but only for files that actually
        # changed (satellite/timezones are managed by hand — leave theirs).
        run: |
          git config user.name "map-imagery-bot"
          git config user.email "map-imagery-bot@users.noreply.github.com"
          git add public/cities.png public/subnational.png \
            public/blank-political.png public/blank-political.webp \
            public/preview-political.webp \
            public/national.png public/ocean.png \
            public/cities-mobile.webp public/subnational-mobile.webp \
            public/blank-political-mobile.webp
          if git diff --cached --quiet; then
            echo "Imagery up to date."
          else
            changed=$(git diff --cached --name-only)
            bump() {
              case " $changed " in
                *"public/$1"*)
                  cur=$(grep -rho "$1?v=[0-9]*" src/lib src/components 2>/dev/null | head -1 | grep -o '[0-9]*$')
                  if [ -n "$cur" ]; then
                    sed -i "s|$1?v=$cur|$1?v=$((cur + 1))|g" src/lib/scale.js src/components/MapView.jsx
                    echo "bumped $1 v$cur -> v$((cur + 1))"
                  fi
                  ;;
              esac
            }
            for f in blank-political.webp blank-political.png blank-political-mobile.webp \
                     preview-political.webp cities.png cities-mobile.webp \
                     subnational.png subnational-mobile.webp; do
              bump "$f"
            done
            git add src/lib/scale.js src/components/MapView.jsx
            git commit -m "auto: pull map imagery from urth-rp/urth-imagery"
            git push
          fi
